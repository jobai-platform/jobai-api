name: Backend CI
on:
  pull_request:
    paths:
      - app/**
      - Dockerfile
      - .dockerignore
      - pyproject.toml
      - poetry.lock
      - tests/**
      - scripts/**
      - .github/workflows/backend-ci.yml
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'hotfix/**'
      - 'release/**'
      - 'bugfix/**'
      - 'refactor/**'
    paths:
      - app/**
      - Dockerfile
      - .dockerignore
      - pyproject.toml
      - poetry.lock
      - tests/**
      - scripts/**
      - .github/workflows/backend-ci.yml

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build-push:
    name: Test, Build and Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}/jobai-backend
      PYTHON_VERSION: "3.13"
      POETRY_VERSION: "2.1.4"
      TAG: ${{ github.sha }}
      DATABASE_URL: postgresql+asyncpg://jobai:jobai@localhost:5432/jobai_test
      DATABASE_URL_TEST: postgresql+asyncpg://jobai:jobai@localhost:5432/jobai_test
      JWT_SECRET: ci-test-secret-not-for-production
      LINKEDIN_CLIENT_ID: dummy
      LINKEDIN_CLIENT_SECRET: dummy

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: jobai
          POSTGRES_PASSWORD: jobai
          POSTGRES_DB: jobai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Stop infinite loop if commit is from GitHub Actions
        if: github.actor == 'github-actions'
        run: |
          echo "Triggered by GitHub Actions bot - skipping workflow."
          exit 0

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        uses: abatilo/actions-poetry@v3
        with:
          poetry-version: ${{ env.POETRY_VERSION }}

      - name: Cache Poetry dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pypoetry
            ~/.cache/pip
          key: poetry-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            poetry-${{ runner.os }}-${{ env.PYTHON_VERSION }}-

      - name: Install dependencies
        run: |
          poetry install --no-interaction --no-ansi --no-root

      - name: Run Tests
        run: poetry run pytest -q

      - name: Login GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Image
        run: |
          docker build \
            --build-arg POETRY_VERSION=$POETRY_VERSION \
            -t $IMAGE_NAME:sha-${GITHUB_SHA::7} \
            -t $IMAGE_NAME:ci .

      - name: Push Docker Image
        if: github.ref == 'refs/heads/main'
        run: |
          docker push $IMAGE_NAME:sha-${GITHUB_SHA::7}
          docker tag $IMAGE_NAME:sha-${GITHUB_SHA::7} $IMAGE_NAME:latest
          docker push $IMAGE_NAME:latest
