name: Deploy Backend (SSH + Docker Compose)

on:
  workflow_run:
    workflows: ["Backend CI"]
    types: [completed]
    branches: ["main"]

concurrency:
  group: production-backend
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            mkdir -p ~/jobai-backend
            cd ~/jobai-backend

            if [ -f docker-compose.prod.yml ]; then
              cp docker-compose.prod.yml docker-compose.prod.yml.previous
            fi
            if [ -f .env ]; then
              cp .env .env.previous
            fi

            cat > docker-compose.prod.yml <<'YML'
            ${{ secrets.COMPOSE_PROD }}
            YML
            cat > .env <<'ENVVARS'
            ${{ secrets.ENV_PROD }}
            ENVVARS

            printf '%s' '${{ secrets.GHCR_TOKEN }}' | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml run --rm app poetry run alembic upgrade head
            docker compose -f docker-compose.prod.yml up -d
            docker compose -f docker-compose.prod.yml ps
            curl -fsS "${SMOKE_BASE_URL:-http://127.0.0.1:5001}/health"
