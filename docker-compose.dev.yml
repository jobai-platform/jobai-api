services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jobai-api-container-dev
    hostname: jobai-api
    environment:
      - PORT=${API_PORT:-5001}
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - TF_CPP_MIN_LOG_LEVEL=2
      - PYTHON_VERSION=3.13
      - RUNNING_IN_DOCKER=1
      - RUN_INTEGRATION_TESTS=1 pytest -q
    ports:
      - ${API_PORT:-5000}:5001
    env_file:
      - .env
    volumes:
      - .:/app
    command: poetry run uvicorn app.main:app --host 0.0.0.0 --port 5001 --reload --log-level debug
    restart: always
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
      ollama:
        condition: service_healthy
    networks:
      - backend
      - postgres

  db:
    image: timescale/timescaledb-ha:pg16
    restart: unless-stopped
    container_name: timescaledb-container-dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: jobai_db
      TIMESCALEDB_TELEMETRY: "off"
    ports:
      - ${POSTGRES_PORT:-5432}:5432
    networks:
      - postgres
    volumes:
      - timescale-data:/var/lib/postgresql/data
      - ./scripts/init-extensions.sql:/docker-entrypoint-initdb.d/init-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jobai_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: minio-container-dev
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - ${MINIO_PORT:-9000}:9000
      - ${MINIO_CONSOLE_PORT:-9001}:9001
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    networks:
      - backend
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: ollama-container-dev
    ports:
      - ${OLLAMA_PORT:-11434}:11434
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - backend
    restart: unless-stopped
    # Uncomment to enable GPU acceleration (NVIDIA only):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 60s

  postgres-admin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin-container-dev
    environment:
      PGADMIN_DEFAULT_EMAIL: test@gmail.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - ${PGADMIN_PORT:-8080}:80
      - ${PGADMIN_PORT_SSL:-8443}:443
      - ${PGADMIN_PORT_SSH:-2222}:22
    depends_on:
      - db
      - app

networks:
  backend:
    driver: bridge
  postgres:
    driver: bridge

volumes:
  timescale-data:
  minio-data:
  ollama-data:
