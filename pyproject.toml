[tool.poetry]
name = "jobai-backend"
version = "0.0.1"
description = "JobAI Backend (FastAPI) – scraping, AI generation, billing"
authors = ["Richardson <rpsantosvix@gmail.com>"]
readme = "README.md"
package-mode=false

[tool.poetry.dependencies]
python = "^3.13"
fastapi = { version = ">=0.116.1,<0.117.0", extras = ["standard"] }
pre-commit = ">=4.3.0,<5.0.0"
uvicorn = "^0.35.0"
python-jose = {extras = ["cryptography"], version = "^3.5.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
pydantic = "^2.11.9"
sqlalchemy = "^2.0.43"
asyncpg = "^0.30.0"
marshmallow = "^4.0.1"
bcrypt = "^5.0.0"
pytest = "^8.4.2"
stripe = "^14.4.1"
httpx = "^0.28.1"
python-jobspy = "^1.1.82"
aioboto3 = "^15.5.0"
pgvector = "^0.4.2"
langgraph = "^0.2"
langchain = "^0.3"
langchain-ollama = "^0.2"
langfuse = "^2.0"
structlog = "^24.0"
slowapi = "^0.1.9"

[tool.poetry.group.dev.dependencies]
ruff = "^0.13.0"
black = "^25.1.0"
mypy = "^1.18.1"
pytest = "^8.4.2"
pytest-asyncio = "^1.2.0"
types-requests = "^2.32.4.20250913"
alembic = "^1.16.5"

[tool.black]
line-length = 120
target-version = ['py313']
skip-string-normalization = true
verbose = true

[tool.mypy]
python_version = "3.13"
strict = false
warn_unused_ignores = true
ignore_missing_imports = true

[tool.isort]
profile = "black"
line_length = 120

[tool.ruff]
line-length = 120
extend-exclude = ["cdat-ui"]

[tool.ruff.lint]
select = ["ALL"]
ignore = ["D", "ANN101", "ANN102"]

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.1.0"
tag_format = "v$version"

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "integration: tests requiring external services (database, network, etc.)",
    "e2e: mark test as end-to-end test",
]
addopts = "-m 'not integration'"
filterwarnings = [
    "ignore::DeprecationWarning:starlette",
]

[tool.vercel]
entrypoint = "app.main:app"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
