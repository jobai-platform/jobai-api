[project]
name = "jobai-backend"
version = "0.0.1"
description = "JobAI Backend (FastAPI) – scraping, AI generation, billing"
authors = [
    {name = "Richardson",email = "rpsantosvix@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard] (>=0.116.1,<0.117.0)"
]

[tool.poetry]
packages = [
    { include = "app" }
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
